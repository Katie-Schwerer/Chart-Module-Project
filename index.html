<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Chart.js Example</title>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
        <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <canvas id="myChart" aria-label="Overdose Rate Data in North Carolina from 2011 to 2024" role="img" width="400" height="200"></canvas>
        <p id="chartDescription">This chart shows the overdose rate data in North Carolina from 2011 to 2024. Overdose Rates Data: 2011 - 12.7, 2012 - 13.1, 2013 - 12.5, 2014 - 12.6, 2015 - 15.6, 2016 - 19.4, 2017 - 24.1, 2018 - 22.2, 2019 - 24.2, 2020 - 31.6, 2021 - 38.2, 2022 - 40.6, 2023 - 41, 2024 - 26.3</p>
        <button id="openTable">Chart Table</button>
        <table id="chartTable"></table>
        <script src="charts.js"></script>
    </body>
</html>
